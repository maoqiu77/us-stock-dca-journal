name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          npm --prefix apps/web ci

      - name: Run API tests
        env:
          PYTHONPATH: apps/api
        run: python -m unittest discover -s apps/api/tests -p 'test_*.py'

      - name: Run web tests
        run: npm --prefix apps/web run test

      - name: Lint web application
        run: npm --prefix apps/web run lint

      - name: Build web application
        run: npm --prefix apps/web run build

      - name: Check public repository safety
        run: python scripts/check_public_safety.py

      - name: Check release readiness
        run: python scripts/check_release_readiness.py
