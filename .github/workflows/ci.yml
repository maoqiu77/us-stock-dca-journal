name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          npm ci

      - name: Run base API tests (optional Agent skips are not Agent acceptance)
        run: python scripts/test_api.py --mode base

      - name: Check pure domain and context contracts
        run: |
          npm --workspace @portfolio/domain test
          npm --workspace @portfolio/domain run typecheck
          npm --workspace @portfolio/ai-context test
          npm --workspace @portfolio/ai-context run typecheck
          npm run check:market-data

      - name: Check WeChat mini program
        run: npm run check:weapp

      - name: Run web tests
        run: npm --prefix apps/web run test

      - name: Lint web application
        run: npm --prefix apps/web run lint

      - name: Build web application
        run: npm --prefix apps/web run build

      - name: Check public repository safety
        run: python scripts/check_public_safety.py

      - name: Check release readiness
        run: python scripts/check_release_readiness.py

  api-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-agent.lock
      - name: Install locked Agent environment
        run: |
          python -m pip install -r apps/api/requirements-agent.lock
          python -m pip check
      - name: Run all API tests (skips fail Agent acceptance)
        run: python scripts/test_api.py --mode agent
