name: Bug report
description: Report a reproducible problem that does not contain sensitive information
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, account data, portfolio data, trade records, logs containing secrets, or security vulnerabilities. Follow SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Version
      description: Application version or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Source development environment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence using synthetic data.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Additional context
      description: Add sanitized screenshots or logs if useful.
